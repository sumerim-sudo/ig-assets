<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>
@font-face{font-family:"P";src:url("../tools/fonts/Poppins-Regular.ttf");font-weight:400}
@font-face{font-family:"P";src:url("../tools/fonts/Poppins-Medium.ttf");font-weight:500}
@font-face{font-family:"P";src:url("../tools/fonts/Poppins-Bold.ttf");font-weight:700}
@font-face{font-family:"P";src:url("../tools/fonts/Poppins-ExtraBold.ttf");font-weight:800}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"P",sans-serif;-webkit-font-smoothing:antialiased}
.slide{width:1080px;height:1920px;position:relative;overflow:hidden;background:linear-gradient(180deg,#5e1c1a 0%,#8a2622 45%,#c93a33 100%);color:#fff;padding:270px 72px 320px;display:flex;flex-direction:column;align-items:center;text-align:center}
.body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;width:100%}
.ft{font-size:22px;font-weight:600;opacity:.85}
h1{font-size:86px;font-weight:800;line-height:.98;letter-spacing:-.03em}
p{font-size:32px;line-height:1.35;font-weight:500;color:#FFE3E0}
.pill{display:inline-flex;align-items:center;gap:10px;background:#CBF23E;color:#1A27B8;border-radius:999px;padding:20px 40px;font-size:30px;font-weight:700}
</style></head><body>
<section class="slide">
  <div style="font-size:26px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.85">@sumerolog · Yeni gönderi</div>
  <div class="body">
    <h1 style="margin-top:34px">Sorun yapay zekâda değil, <span style="color:#CBF23E">bizde.</span></h1>
    <img src="photos/kitap.png" style="width:720px;height:auto;margin-top:36px;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 8%,#000 94%,transparent 100%),linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%);-webkit-mask-composite:source-in;filter:drop-shadow(0 30px 60px rgba(0,0,0,.45))">
    <p style="margin-top:26px;max-width:820px">Ayşegül İldeniz'in yeni kitabından 8 fikir — profilde, 9 slaytlık carousel.</p>
    <span class="pill" style="margin-top:34px">Profildeki gönderiye git ↑</span>
  </div>
</section>
</body></html>
